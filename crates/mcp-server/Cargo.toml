[package]
name = "ezman-mcp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ezman-mcp"
path = "src/main.rs"

[dependencies]
ezman-core = { path = "../core" }
rmcp = { version = "3.8", features = ["server", "transport-io"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13"
